<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0818" />
    <title>Кицу</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Стили для мгновенного показа загрузочного экрана -->
    <style>
      #loading-overlay {
        position: fixed;
        inset: 0;
        background-color: #000;
        background-image: url("/assets/image/load.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- ЗАГРУЗОЧНЫЙ ЭКРАН — первый в DOM, появляется мгновенно -->
    <div id="loading-overlay">
      <h1
        style="
          font-family: 'Press Start 2P', cursive;
          color: white;
          text-shadow: 3px 3px 5px pink;
          animation: pulse 2s infinite;
          font-size: 32px;
          margin-bottom: 20px;
        "
      >
        Kitsu Care
      </h1>
      <div
        class="spinner"
        style="
          width: 60px;
          height: 60px;
          border: 6px solid #f3f3f3;
          border-top: 6px solid #ff69b4;
          border-radius: 50%;
          animation: spin 1s linear infinite,
            glow 1.5s ease-in-out infinite alternate;
        "
      ></div>
    </div>

    <!-- Основной контейнер для Phaser-игры -->
    <div id="game-container"></div>

    <!-- Накладываемый интерфейс (UI) — под загрузочным экраном -->
    <div id="ui-overlay">
      <!-- Статус-бар -->
      <div class="status-bar">
        <div id="level-stat">Lv. <span id="level">1</span></div>
        <div class="stats-center">
          <div class="stat hunger">
            <span class="icon">🍙</span>
            <div class="progress-container">
              <div id="hunger-bar" class="progress-bar"></div>
            </div>
          </div>
          <div class="stat mood">
            <span class="icon">🦊</span>
            <div class="progress-container">
              <div id="mood-bar" class="progress-bar"></div>
            </div>
          </div>
          <div class="stat energy">
            <span class="icon">⚡</span>
            <div class="progress-container">
              <div id="energy-bar" class="progress-bar"></div>
            </div>
          </div>
          <div class="stat cleanliness">
            <span class="icon">🧼</span>
            <div class="progress-container">
              <div id="cleanliness-bar" class="progress-bar"></div>
            </div>
          </div>
        </div>
        <div id="money-stat" class="money-pill">
          <span class="coin-icon">💰</span>
          <span id="money" class="money-value">300</span>
        </div>
      </div>

      <!-- Диалоговое окно -->
      <div id="dialogue-box" class="hidden">
        <div id="dialogue-text"></div>
        <div class="dialogue-buttons"></div>
      </div>
    </div>

    <!-- Скрипт игры -->
    <script src="js/game.js"></script>
  </body>
</html>
