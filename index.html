<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация IDEF0 графов для МойДневник</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .graph-container {
            margin: 20px 0;
            border: 1px solid #ccc;
            padding: 10px;
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Генерация IDEF0 графов для бизнес-процессов МойДневник</h1>
    <div id="authorization-graph" class="graph-container"></div>
    <button onclick="downloadGraph('authorization-graph', 'authorization_idef0.png')">Скачать Авторизация (PNG)</button>
    <div id="create-entry-graph" class="graph-container"></div>
    <button onclick="downloadGraph('create-entry-graph', 'create_entry_idef0.png')">Скачать Создание записи (PNG)</button>
    <div id="add-sticker-graph" class="graph-container"></div>
    <button onclick="downloadGraph('add-sticker-graph', 'add_sticker_idef0.png')">Скачать Добавление стикера (PNG)</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script>
    <script>
        // Инициализация Viz.js
        const viz = new Viz();

        // Данные процессов
        const processes = [
            {
                name: "Authorization",
                functionLabel: "Авторизация пользователя",
                inputs: [{label: "Email и пароль", id: "I1"}],
                outputs: [
                    {label: "Аутентифицированный\\nпользователь", id: "O1"},
                    {label: "Сообщение об ошибке", id: "O2"}
                ],
                controls: [{label: "Правила авторизации\\n(Firebase Auth)", id: "C1"}],
                mechanisms: [
                    {label: "Веб-интерфейс\\n(login.html)", id: "M1"},
                    {label: "Firebase\\nAuthentication", id: "M2"}
                ],
                containerId: "authorization-graph"
            },
            {
                name: "CreateEntry",
                functionLabel: "Создание записи",
                inputs: [{label: "Данные записи\\n(дата, заголовок,\\nсодержание, изображение)", id: "I1"}],
                outputs: [
                    {label: "Сохраненная запись\\n(Firestore)", id: "O1"},
                    {label: "Уведомление об успехе", id: "O2"},
                    {label: "Сообщение об ошибке", id: "O3"}
                ],
                controls: [{label: "Правила валидации\\n(обязательное содержание)", id: "C1"}],
                mechanisms: [
                    {label: "Веб-интерфейс\\n(diary.html)", id: "M1"},
                    {label: "Firestore", id: "M2"},
                    {label: "Firebase Storage", id: "M3"}
                ],
                containerId: "create-entry-graph"
            },
            {
                name: "AddSticker",
                functionLabel: "Добавление стикера",
                inputs: [
                    {label: "Стикер\\n(системный или пользовательский)", id: "I1"},
                    {label: "Координаты (x, y)", id: "I2"}
                ],
                outputs: [
                    {label: "Стикер в записи\\n(Firestore)", id: "O1"},
                    {label: "Сохраненный стикер\\n(Firebase Storage)", id: "O2"},
                    {label: "Сообщение об ошибке", id: "O3"}
],
                controls: [{label: "Правила загрузки\\n(формат файла)", id: "C1"}],
                mechanisms: [
                    {label: "Веб-интерфейс\\n(diary.html)", id: "M1"},
                    {label: "Firestore", id: "M2"},
                    {label: "Firebase Storage", id: "M3"}
                ],
                containerId: "add-sticker-graph"
            }
        ];

        // Функция для генерации DOT-кода
        function generateDotCode(process) {
            return 
                digraph ${process.name} {
                    rankdir=TB;
                    node [fontsize=12, width=2, height=0.8];
                    edge [fontsize=10, arrowhead=vee, color=navy];
                    
                    A0 [label="A-0\\n${process.functionLabel}", shape=box, style=filled, fillcolor=lightblue];
                    
                    ${process.inputs.map((input, i) => 
                        I${i+1} [label="${input.label}", shape=plaintext, fillcolor=none];
                        I${i+1} -> A0 [label="${input.id}"];
                    ).join('\n')}
                    
                    ${process.outputs.map((output, i) => 
                        O${i+1} [label="${output.label}", shape=plaintext, fillcolor=none];
                        A0 -> O${i+1} [label="${output.id}"];
                    ).join('\n')}
                    
                    ${process.controls.map((control, i) => 
                        C${i+1} [label="${control.label}", shape=plaintext, fillcolor=none];
                        C${i+1} -> A0 [label="${control.id}", style=dashed, arrowhead=dot];
                    ).join('\n')}
                    
                    ${process.mechanisms.map((mechanism, i) => 
                        M${i+1} [label="${mechanism.label}", shape=plaintext, fillcolor=none];
                        M${i+1} -> A0 [label="${mechanism.id}", style=dotted, arrowhead=tee];
                    ).join('\n')}
                    
                    {rank=min; ${process.inputs.map((_, i) => I${i+1}).join(';')};}
                    {rank=same; ${process.outputs.map((_, i) => O${i+1}).join(';')};}
                    {rank=max; ${process.controls.map((_, i) => C${i+1}).join(';')};${process.mechanisms.map((_, i) => M${i+1}).join(';')};}
                }
            ;
        }

        // Рендеринг графов
        processes.forEach(process => {
            const dotCode = generateDotCode(process);
            viz.renderSVGElement(dotCode)
                .then(element => {
                    document.getElementById(process.containerId).appendChild(element);
                })
                .catch(error => console.error("Ошибка рендеринга:", error));
        });

        // Функция для скачивания графа как PNG
        function downloadGraph(containerId, filename) {
            const svg = document.getElementById(containerId).querySelector('svg');
            if (!svg) {
                alert("Граф не найден!");
                return;
            }
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const png = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = png;
                link.download = filename;
                link.click();
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
        }
    </script>
</body>
</html>

                ],
                containerId: "create-entry-graph"
            },
            {
                name: "AddSticker",
                functionLabel: "Добавление стикера",
                inputs: [
                    {label: "Стикер\\n(системный или пользовательский)", id: "I1"},
                    {label: "Координаты (x, y)", id: "I2"}
                ],
                outputs: [
                    {label: "Стикер в записи\\n(Firestore)", id: "O1"},
                    {label: "Сохраненный стикер\\n(Firebase Storage)", id: "O2"},
                    {label: "Сообщение об ошибке", id: "O3"}
                ],
                controls: [{label: "Правила загрузки\\n(формат файла)", id: "C1"}],
mechanisms: [
                    {label: "Веб-интерфейс\\n(diary.html)", id: "M1"},
                    {label: "Firestore", id: "M2"},
                    {label: "Firebase Storage", id: "M3"}
                ],
                containerId: "add-sticker-graph"
            }

        // Функция для генерации DOT-кода
        function generateDotCode(process) {
            return 
                digraph ${process.name} {
                    rankdir=TB;
                    node [fontsize=12, width=2, height=0.8];
                    edge [fontsize=10, arrowhead=vee, color=navy];
                    
                    A0 [label="A-0\\n${process.functionLabel}", shape=box, style=filled, fillcolor=lightblue];
                    
                    ${process.inputs.map((input, i) => 
                        I${i+1} [label="${input.label}", shape=plaintext, fillcolor=none];
                        I${i+1} -> A0 [label="${input.id}"];
                    ).join('\n')}
                    
                    ${process.outputs.map((output, i) => 
                        O${i+1} [label="${output.label}", shape=plaintext, fillcolor=none];
                        A0 -> O${i+1} [label="${output.id}"];
                    ).join('\n')}
                    
                    ${process.controls.map((control, i) => 
                        C${i+1} [label="${control.label}", shape=plaintext, fillcolor=none];
                        C${i+1} -> A0 [label="${control.id}", style=dashed, arrowhead=dot];
                    ).join('\n')}
                    
                    ${process.mechanisms.map((mechanism, i) => 
                        M${i+1} [label="${mechanism.label}", shape=plaintext, fillcolor=none];
                        M${i+1} -> A0 [label="${mechanism.id}", style=dotted, arrowhead=tee];
                    ).join('\n')}
                    
                    {rank=min; ${process.inputs.map((_, i) => I${i+1}).join(';')};}
                    {rank=same; ${process.outputs.map((_, i) => O${i+1}).join(';')};}
                    {rank=max; ${process.controls.map((_, i) => C${i+1}).join(';')};${process.mechanisms.map((_, i) => M${i+1}).join(';')};}
                }
            ;
        }

        // Рендеринг графов
        viz.graphviz().then(graphviz => {
            processes.forEach(process => {
                const dotCode = generateDotCode(process);
                const container = document.getElementById(process.containerId);
                try {
                    const svg = graphviz.renderSVGElement(dotCode);
                    container.innerHTML = '';
                    container.appendChild(svg);
                    console.log(Граф ${process.name} успешно отрендерен);
                } catch (error) {
                    console.error(Ошибка рендеринга графа ${process.name}:, error);
                    container.innerHTML = <p>Ошибка: ${error.message}</p>;
                }
            });
        }).catch(error => {
            console.error("Ошибка загрузки @hpcc-js/wasm:", error);
            processes.forEach(process => {
                document.getElementById(process.containerId).innerHTML = <p>Ошибка загрузки библиотеки: ${error.message}</p>;
            });
        });

        // Функция для скачивания графа как PNG
        function downloadGraph(containerId, filename) {
            const svg = document.getElementById(containerId).querySelector('svg');

                alert("Граф не найден! Проверьте консоль для ошибок.");

            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
const img = new Image();

                const scale = 2;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.scale(scale, scale);
                ctx.drawImage(img, 0, 0);
                const png = canvas.toDataURL('image/png');
                const link = document.createElement('a');

                link.download = filename;
                link.click();
            };

                alert("Ошибка загрузки SVG!");
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
