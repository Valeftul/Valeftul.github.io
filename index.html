<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDEF0 Диаграмма из DOT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #editor {
            width: 80%;
            height: 200px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
        }
        #output {
            border: 1px solid #ccc;
            padding: 10px;
            width: 80%;
            min-height: 400px;
            overflow: auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .idef0-box {
            fill: #f0f0f0;
            stroke: #000;
            stroke-width: 2;
        }
        .idef0-label {
            font-family: Arial;
            font-size: 12px;
        }
        .idef0-arrow {
            stroke: #000;
            stroke-width: 2;
        }
    </style>
</head>
<body>
    <h1>Генератор IDEF0 диаграмм</h1>
    <textarea id="editor" placeholder="Введите DOT-подобный код для IDEF0...">
digraph IDEF0 {
    rankdir=LR;
    node [shape=box, style=filled, fillcolor=lightgrey, width=2, height=1];
    edge [arrowhead=vee];

    A0 [label="Процесс A0"];
    Input [shape=none, label="Вход"];
    Control [shape=none, label="Управление"];
    Output [shape=none, label="Выход"];
    Mechanism [shape=none, label="Механизм"];

    Input -> A0 [label="Входной поток"];
    Control -> A0 [label="Управляющий поток", constraint=false];
    A0 -> Output [label="Выходной поток"];
    Mechanism -> A0 [label="Механизм", constraint=false, style=dashed];
}
    </textarea>
    <button onclick="renderDiagram()">Сгенерировать диаграмму</button>
    <div id="output"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script>
    <script>
        function renderDiagram() {
            const dot = document.getElementById('editor').value;
            const output = document.getElementById('output');
            
            try {
                const viz = new Viz();
                viz.renderSVGElement(dot)
                    .then(function(element) {
                        // Очистка предыдущего вывода
                        output.innerHTML = '';
                        // Добавление SVG в output
                        output.appendChild(element);
                    })
                    .catch(error => {
                        console.error(error);
                        output.innerHTML = '<p style="color: red;">Ошибка при генерации диаграммы: ' + error.message + '</p>';
                    });
            } catch (error) {
                output.innerHTML = '<p style="color: red;">Ошибка: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
